services:
  - type: web
    name: talentum-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentum-db
          property: connectionString
      # Set these in the Render dashboard (they hold real secrets / your URLs):
      #   FRONTEND_URL, CORS_ORIGINS
      #   STORAGE_BACKEND=s3, S3_BUCKET_NAME, AWS_ACCESS_KEY_ID,
      #   AWS_SECRET_ACCESS_KEY, AWS_REGION
      #   EMAIL_BACKEND=smtp, SMTP_HOST, SMTP_PORT, SMTP_USER,
      #   SMTP_PASSWORD, SMTP_FROM_EMAIL
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: talentum-db
    plan: free
